name: Update Contributors

# Regenerates the contributor grid between the readme markers in README.md so
# the list stays current without hand edits. Listed: everyone with a MERGED
# pull request, sourced from the PR history rather than commit authorship -
# releases squash dev into main under the release identity, so contributor
# commits don't survive on the default branch and the commit-based
# contributors API misses them. Bots and the release account are excluded.
# Runs weekly and on demand only - not on push - so it never triggers the
# release workflow, and its commit carries [skip ci] as a second guard.
#
# This used to be a third-party readme action, replaced with a plain script:
# the action could not exclude mixed-case logins (it lowercased the exclusion
# but compared against the raw login, so the release account always listed
# itself), it crashed parsing any hand-edited grid, and it read commit
# authorship, which the squash-release flow erases.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT (same one the release workflow uses) so the commit can land on
          # the default branch directly.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Regenerate contributor grid
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          : > /tmp/pulls.json
          page=1
          while true; do
            curl -sf -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pulls?state=closed&per_page=100&page=$page" \
              > /tmp/pulls-page.json
            count=$(python3 -c "import json;print(len(json.load(open('/tmp/pulls-page.json'))))")
            cat /tmp/pulls-page.json >> /tmp/pulls.json
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done

          python3 - <<'EOF'
          import json
          import re

          EXCLUDED = {"sportarr", "claude"}
          COLUMNS = 6
          START = "<!-- readme: contributors,claude/-,Sportarr/- -start -->"
          END = "<!-- readme: contributors,claude/-,Sportarr/- -end -->"

          merged = []
          with open("/tmp/pulls.json") as f:
              # The file is concatenated JSON arrays, one per page.
              decoder = json.JSONDecoder()
              text = f.read()
              pos = 0
              while pos < len(text):
                  while pos < len(text) and text[pos].isspace():
                      pos += 1
                  if pos >= len(text):
                      break
                  batch, pos = decoder.raw_decode(text, pos)
                  merged.extend(p for p in batch if p.get("merged_at"))

          by_login = {}
          for pr in merged:
              user = pr["user"]
              login = user["login"]
              if (
                  user.get("type") == "Bot"
                  or login.lower().endswith("[bot]")
                  or login.lower() in EXCLUDED
              ):
                  continue
              entry = by_login.setdefault(
                  login, {"login": login, "avatar_url": user["avatar_url"], "count": 0}
              )
              entry["count"] += 1

          # Most merged PRs first; ties alphabetically for a stable grid.
          people = sorted(
              by_login.values(), key=lambda e: (-e["count"], e["login"].lower())
          )

          cells = []
          for c in people:
              cells.append(
                  "            <td align=\"center\">\n"
                  f"                <a href=\"https://github.com/{c['login']}\">\n"
                  f"                    <img src=\"{c['avatar_url']}\" width=\"72;\" alt=\"{c['login']}\"/>\n"
                  "                    <br />\n"
                  f"                    <sub><b>{c['login']}</b></sub>\n"
                  "                </a>\n"
                  "            </td>"
              )

          rows = []
          for i in range(0, len(cells), COLUMNS):
              rows.append("\t\t<tr>\n" + "\n".join(cells[i : i + COLUMNS]) + "\n\t\t</tr>")

          grid = "<table>\n\t<tbody>\n" + "\n".join(rows) + "\n\t</tbody>\n</table>"

          with open("README.md") as f:
              readme = f.read()

          pattern = re.compile(re.escape(START) + r"[\s\S]*?" + re.escape(END))
          replacement = START + "\n" + grid + "\n" + END
          updated = pattern.sub(lambda _: replacement, readme, count=1)

          with open("README.md", "w") as f:
              f.write(updated)

          print(f"grid rebuilt with {len(people)} contributors")
          EOF

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "Contributor grid unchanged"
            exit 0
          fi
          git config user.name "Sportarr"
          git config user.email "sportarr@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update contributors list [skip ci]"
          git push
